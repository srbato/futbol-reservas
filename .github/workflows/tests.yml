name: Tests

# Corre en cada Pull Request y en cada push a develop.
# Si algo falla, GitHub bloquea el merge (si activaste la protección de rama).
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  tests:
    name: Suite de tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, bcmath, gmp, intl, zip, gd, exif, pcntl, sockets
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.docker.example .env
          php artisan key:generate

      - name: Cachear dependencias de Node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}
          restore-keys: node-

      - name: Compilar assets
        # Necesario: las vistas que usan @vite fallan sin el manifest.
        run: |
          npm ci
          npm run build

      - name: Correr tests
        run: php artisan test
