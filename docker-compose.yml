# Entorno de desarrollo de TuCancha.
#
# Levantar todo:   docker compose up -d
# Ver logs:        docker compose logs -f app
# Consola:         docker compose exec app bash
# Datos de prueba: docker compose exec app php artisan migrate:fresh --seed
#
# Servicios y puertos en el host:
#   http://localhost:8000  → la app
#   localhost:5433         → PostgreSQL (5433 para no chocar con uno local)
#   localhost:8080         → Reverb (websockets)
#   http://localhost:5173  → Vite dev server (hot reload)

# Variables que SIEMPRE deben valer esto dentro de Docker, sin importar lo que
# diga el .env del desarrollador. Laravel no pisa las variables que ya existen
# en el entorno, así que estas ganan sobre el archivo .env.
#
# Es lo que permite tener un .env apuntando a ngrok/producción y que igual
# funcione todo en local: acá se corrige la URL, el esquema y la base.
x-php-env: &php-env
  # Base de datos del contenedor (no la que tengas instalada en tu máquina)
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: tucancha
  DB_USERNAME: tucancha
  DB_PASSWORD: secret
  # Por defecto la app vive en localhost. Sin esto, un .env con APP_URL de
  # ngrok hace que Laravel genere los links con https y el navegador tire
  # ERR_SSL_PROTOCOL_ERROR (además de romper la sesión por la cookie segura).
  #
  # Mercado Pago y el login con Google NO funcionan contra localhost: MP
  # rechaza esas URLs y necesita alcanzarte por webhook, y Google sólo
  # redirige a una URL registrada en su consola. Para probarlos hay que
  # exponer el puerto 8000 con ngrok y definir PUBLIC_URL con ese dominio
  # (ver DESARROLLO.md → "Probar pagos y login con Google").
  APP_URL: ${PUBLIC_URL:-http://localhost:8000}
  ASSET_URL: ${PUBLIC_URL:-http://localhost:8000}
  GOOGLE_REDIRECT_URI: ${PUBLIC_URL:-http://localhost:8000}/auth/google/callback
  SESSION_SECURE_COOKIE: "false"
  # En desarrollo los mails se escriben en storage/logs, no se envían
  MAIL_MAILER: log
  # Websockets dentro de la red de Docker
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOSTNAME: 0.0.0.0
  REVERB_CLIENT_HOST: localhost
  REVERB_CLIENT_PORT: 8080

# Configuración común de los 4 servicios PHP: comparten imagen y código,
# sólo cambia el comando que ejecutan.
x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  restart: unless-stopped
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy
  networks: [tucancha]

services:
  # ── Aplicación (PHP-FPM) ────────────────────────────────────────────
  app:
    <<: *php-service
    container_name: tucancha-app
    environment:
      <<: *php-env
      CONTAINER_ROLE: app

  # ── Servidor web ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tucancha-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [tucancha]

  # ── Base de datos ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tucancha-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tucancha
      POSTGRES_USER: tucancha
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tucancha -d tucancha"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tucancha]

  # ── Worker de colas (emails, notificaciones) ────────────────────────
  queue:
    <<: *php-service
    container_name: tucancha-queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *php-env
      CONTAINER_ROLE: queue

  # ── Reverb (websockets: chat de Falta Uno, disponibilidad live) ─────
  reverb:
    <<: *php-service
    container_name: tucancha-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      <<: *php-env
      CONTAINER_ROLE: reverb

  # ── Scheduler (tareas programadas) ──────────────────────────────────
  scheduler:
    <<: *php-service
    container_name: tucancha-scheduler
    command: php artisan schedule:work
    environment:
      <<: *php-env
      CONTAINER_ROLE: scheduler

  # ── Vite (assets + hot reload) ──────────────────────────────────────
  vite:
    image: node:20-alpine
    container_name: tucancha-vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      VITE_HOST: 0.0.0.0
    networks: [tucancha]

volumes:
  pgdata:
  node_modules:

networks:
  tucancha:
    driver: bridge
