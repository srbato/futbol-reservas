; Configuración de PHP para el entorno de desarrollo en Docker.
; No usar en producción.

memory_limit = 512M
max_execution_time = 120

; Uploads: portadas de complejos/canchas e imágenes del blog
upload_max_filesize = 20M
post_max_size = 25M

; Errores visibles en dev (en producción APP_DEBUG=false los oculta igual)
display_errors = On
error_reporting = E_ALL

; OPcache: en dev revalidamos siempre para que los cambios se vean al instante
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

date.timezone = America/Argentina/Buenos_Aires
