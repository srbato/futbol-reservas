server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    client_max_body_size 25M;

    # Assets estáticos
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # nginx resuelve el nombre "app" una sola vez al arrancar. Si el
        # contenedor de PHP se recrea cambia de IP y nginx sigue apuntando a
        # la vieja → 502 "Connection refused" hasta reiniciar nginx.
        #
        # Con el resolver interno de Docker (127.0.0.11) y pasando el destino
        # por variable, el DNS se vuelve a resolver y el 502 desaparece solo.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_php app:9000;
        fastcgi_pass $upstream_php;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Uploads y requests lentos en dev (ej: importar datos)
        fastcgi_read_timeout 120;
    }

    # No servir archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
