[program:tucancha-scheduler]
process_name=%(program_name)s
; El scheduler de Laravel requiere ejecutarse cada minuto.
; Supervisord no soporta intervalos menores a 1 proceso continuo,
; por lo que se usa el enfoque de loop con sleep en lugar de crontab.
;
; Alternativa recomendada con crontab (agregar via: crontab -e):
;   * * * * * www-data php /home/santiago/tucancha/artisan schedule:run >> /dev/null 2>&1
;
; Si preferís gestionarlo con supervisord sin crontab, usá este programa:
command=bash -c "while true; do php /home/santiago/tucancha/artisan schedule:run >> /var/log/supervisor/tucancha-scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=santiago
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tucancha-scheduler.log
